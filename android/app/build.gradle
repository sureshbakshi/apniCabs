def hermesEnabled = true
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"
apply plugin: "com.bugsnag.android.gradle"
apply plugin: 'com.google.gms.google-services'
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

react {
    hermesFlags = ["-O", "-output-source-map"]
    autolinkLibrariesWithApp()
}

def enableSeparateBuildPerCPUArchitecture = false
def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def googleMapsKey = project.env.getOrDefault("GOOGLE_MAPS_KEY", "")
def appId = project.env.getOrDefault("APP_ID", "")

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    namespace "com.apnicabi"
    splits {
        abi {
            reset()
            enable true
            universalApk false
            include(*reactNativeArchitectures())
        }
    }

    flavorDimensions "user_type", "build_type"
    productFlavors {
        user {
            dimension "user_type"
            applicationId appId
            versionCode 38
            versionName "2.2.5"
            versionNameSuffix "-user"
            resValue "string", "build_config_package", "com.apnicabi"
        }
        driver {
            dimension "user_type"
            applicationId appId
            versionCode 38
            versionName "2.1.4"
            versionNameSuffix "-driver"
            resValue "string", "build_config_package", "com.apnicabi"
        }
        dev {
            dimension "build_type"
            versionNameSuffix "-dev"
            manifestPlaceholders = [GOOGLE_MAPS_KEY: googleMapsKey ?: ""]
        }
        prod {
            dimension "build_type"
            manifestPlaceholders = [GOOGLE_MAPS_KEY: googleMapsKey ?: ""]
        }
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        missingDimensionStrategy "RNNotifications.reactNativeVersion", "reactNative60"
        resConfigs "en", "hi"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug', 'release']
        }
        release {
            signingConfig signingConfigs.release
            crunchPngs false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // ✅ Updated packaging for 16 KB zip alignment
    packaging {
        jniLibs {
            useLegacyPackaging = false // <— required for 16 KB alignment
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.0.0")

    implementation(project(':react-native-maps')) {
        exclude group: 'com.google.android.gms'
    }
    implementation 'com.google.android.gms:play-services-base:18.0.1'
    implementation('com.google.android.gms:play-services-location:21.0.1')
    implementation('com.google.android.gms:play-services-maps:18.0.2')

    implementation project(':react-native-html-to-pdf')
    implementation platform("com.google.firebase:firebase-bom:32.8.0")
    implementation project(':react-native-immediate-phone-call')
    implementation project(':react-native-config')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }
    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
